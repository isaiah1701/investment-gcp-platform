apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: equity-alerts
  labels: { release: kube-prometheus-stack }
spec:
  groups:
    - name: equity.rules
      rules:
        - alert: EquityDown
          expr: up{job="equity"} == 0
          for: 2m
          labels: { severity: critical }
          annotations: { summary: Equity metrics target is unavailable }
        - alert: EquityHighErrorRate
          expr: sum(rate(equity_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(equity_http_requests_total[5m])), 0.1) > 0.05 and sum(increase(equity_http_requests_total[5m])) >= 30
          for: 5m
          labels: { severity: warning }
          annotations: { summary: Equity HTTP 5xx rate is above 5 percent }
        - alert: EquityHighLatency
          expr: histogram_quantile(0.95, sum by (le) (rate(equity_http_request_duration_seconds_bucket[5m]))) > 2 and sum(rate(equity_http_request_duration_seconds_count[5m])) > 0.1
          for: 5m
          labels: { severity: warning }
          annotations: { summary: Equity p95 request latency is above two seconds }
        - alert: EquityAlphaVantageErrors
          expr: sum(rate(equity_alpha_vantage_api_requests_total{outcome="error"}[10m])) / clamp_min(sum(rate(equity_alpha_vantage_api_requests_total[10m])), 0.01) > 0.5 and sum(increase(equity_alpha_vantage_api_requests_total[10m])) >= 4
          for: 5m
          labels: { severity: warning }
          annotations: { summary: Alpha Vantage requests are failing or rate limited }
        - alert: EquityPodRestarts
          expr: increase(kube_pod_container_status_restarts_total{namespace="app",pod=~"app-.*"}[15m]) > 2
          for: 0m
          labels: { severity: warning }
          annotations: { summary: Equity pod restarted more than twice in 15 minutes }
