apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: equity-alpha-vantage-api-key
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/{{ .Values.secret.projectId }}/secrets/{{ .Values.secret.name }}/versions/latest"
        path: "investment-api-key"
