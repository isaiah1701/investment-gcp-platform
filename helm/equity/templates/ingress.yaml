{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sky
  annotations:
    kubernetes.io/ingress.class: gce
    kubernetes.io/ingress.global-static-ip-name: {{ .Values.ingress.staticIpName | quote }}
    networking.gke.io/managed-certificates: {{ .Values.ingress.managedCertificateNames | default (list .Values.ingress.managedCertificateName) | join "," | quote }}
    kubernetes.io/ingress.allow-http: "false"
spec:
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: sky, port: { number: {{ .Values.service.port }} } }
    {{- range .Values.ingress.additionalHosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: sky, port: { number: {{ $.Values.service.port }} } }
    {{- end }}
{{- end }}
