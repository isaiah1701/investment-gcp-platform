apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: {{ .Values.ingress.managedCertificateName }}
spec:
  domains:
    - {{ .Values.ingress.host | quote }}
{{- range .Values.ingress.additionalManagedCertificates }}
---
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: {{ .name }}
spec:
  domains:
    - {{ .domain | quote }}
{{- end }}
