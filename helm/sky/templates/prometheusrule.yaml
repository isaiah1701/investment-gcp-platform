apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: sky-alerts
  labels: { release: kube-prometheus-stack }
spec:
  groups:
    - name: sky.rules
      rules:
        - alert: SkyDown
          expr: up{job="sky"} == 0
          for: 2m
          labels: { severity: critical }
          annotations: { summary: Sky metrics target is unavailable }
        - alert: SkyHighErrorRate
          expr: sum(rate(sky_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(sky_http_requests_total[5m])), 0.1) > 0.05 and sum(increase(sky_http_requests_total[5m])) >= 30
          for: 5m
          labels: { severity: warning }
          annotations: { summary: Sky HTTP 5xx rate is above 5 percent }
        - alert: SkyHighLatency
          expr: histogram_quantile(0.95, sum by (le) (rate(sky_http_request_duration_seconds_bucket[5m]))) > 2 and sum(rate(sky_http_request_duration_seconds_count[5m])) > 0.1
          for: 5m
          labels: { severity: warning }
          annotations: { summary: Sky p95 request latency is above two seconds }
        - alert: SkyPodRestarts
          expr: increase(kube_pod_container_status_restarts_total{namespace="sky",pod=~"sky-.*"}[15m]) > 2
          for: 0m
          labels: { severity: warning }
          annotations: { summary: Sky pod restarted more than twice in 15 minutes }
