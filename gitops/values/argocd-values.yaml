global:
  domain: argocd.depl0y.site
configs:
  params:
    server.insecure: true
  cm:
    url: https://argocd.depl0y.site
server:
  service:
    type: ClusterIP
  ingress:
    enabled: false
controller:
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 750m, memory: 768Mi }
repoServer:
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }
applicationSet:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 250m, memory: 256Mi }
redis:
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 250m, memory: 256Mi }
dex:
  enabled: false
notifications:
  enabled: false
