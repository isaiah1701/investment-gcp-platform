apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-edge
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:isaiah1701/wealth-os-gke-platform.git
    targetRevision: main
    path: gitops/resources
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: { prune: true, selfHeal: true }
