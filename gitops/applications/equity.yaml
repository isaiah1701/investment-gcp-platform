apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: equity
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: git@github.com:isaiah1701/wealth-os-gke-platform.git
      targetRevision: main
      path: helm/equity
      helm:
        valueFiles: [$values/gitops/values/app-values.yaml]
    - repoURL: git@github.com:isaiah1701/wealth-os-gke-platform.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: sky
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
