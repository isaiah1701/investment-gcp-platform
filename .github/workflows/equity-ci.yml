name: Equity App CI
on:
  pull_request:
    paths: ["my-apps/investments-app/**", "Dockerfile", ".dockerignore", ".github/workflows/equity-ci.yml"]
  workflow_call:
  push:
    branches: [main]
    paths: ["my-apps/investments-app/**", "Dockerfile", ".dockerignore"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: my-apps/investments-app/package-lock.json }
      - run: npm ci
        working-directory: my-apps/investments-app
      - run: npm test
        working-directory: my-apps/investments-app
      - run: npm run lint
        working-directory: my-apps/investments-app
      - run: npm run typecheck
        working-directory: my-apps/investments-app
      - run: npm run build
        working-directory: my-apps/investments-app
