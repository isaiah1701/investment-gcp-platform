name: Sky Image Build and Promotion
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["app/**", "Dockerfile", ".dockerignore", "helm/sky/**"]
permissions:
  contents: write
  id-token: write
  pull-requests: write
jobs:
  app-ci:
    uses: ./.github/workflows/app-ci.yml
  build-scan-push:
    needs: app-ci
    if: ${{ vars.GCP_WIF_PROVIDER != '' && vars.GCP_IMAGE_SERVICE_ACCOUNT != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_IMAGE_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: docker/setup-buildx-action@v3
      - name: Build candidate image
        run: docker buildx build --load --provenance=false --tag "$IMAGE:$GITHUB_SHA" .
        env:
          IMAGE: europe-west2-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/sky/sky
      - name: Scan candidate image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: europe-west2-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/sky/sky:${{ github.sha }}
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
      - name: Authenticate Docker to Artifact Registry
        run: gcloud auth configure-docker europe-west2-docker.pkg.dev --quiet
      - name: Push scanned image
        run: docker push "$IMAGE:$GITHUB_SHA"
        env:
          IMAGE: europe-west2-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/sky/sky
      - name: Capture immutable digest
        id: image
        run: |
          DIGEST=$(gcloud artifacts docker images describe "$IMAGE:$GITHUB_SHA" --format='value(image_summary.digest)')
          test -n "$DIGEST"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
        env:
          IMAGE: europe-west2-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/sky/sky
      - name: Promote digest in GitOps values
        run: |
          python3 scripts/update-image-digest.py --values gitops/values/app-values.yaml --digest '${{ steps.image.outputs.digest }}'
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add gitops/values/app-values.yaml
          git commit -m "chore(gitops): promote Sky image ${GITHUB_SHA::12}"
          if ! git push origin HEAD:main; then
            BRANCH="promote-sky-${GITHUB_SHA::12}"
            git push origin "HEAD:$BRANCH"
            gh pr create --base main --head "$BRANCH" --title "Promote Sky image ${GITHUB_SHA::12}" --body "Promotes the Trivy-scanned immutable image digest ${{ steps.image.outputs.digest }}."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
